services:
  ring-gate:
    build: .
    container_name: ring-gate
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    volumes:
      # il .env deve restare scrivibile: Ring ruota il refresh token
      # e il servizio lo riscrive qui dentro
      - ./.env:/app/.env
      # required: per-intercom schedule + timing (file must exist before compose up)
      - ./devices.json:/app/devices.json:ro
      # optional file log when LOG_FILE > 0 (create first: touch auto-unlock.log)
      # - ./auto-unlock.log:/app/auto-unlock.log


